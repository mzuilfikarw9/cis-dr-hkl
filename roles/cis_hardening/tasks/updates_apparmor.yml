---
- name: Update apt cache (Item 4)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Apply security upgrades (Item 4)
  ansible.builtin.apt:
    upgrade: safe
    autoremove: false
    lock_timeout: 600  # Tells ansible to wait up to 10 minutes (600s) for the lock to clear
  register: _upgrade
  retries: 3
  delay: 15
  until: _upgrade is succeeded

- name: Install AppArmor and utilities (Item 5)
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
    state: present

- name: Enable AppArmor in GRUB cmdline (Item 6)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor audit=1 audit_backlog_limit={{ cis_audit_backlog_limit }}"'
    backrefs: false
  notify: update grub

- name: Enable and start AppArmor service
  ansible.builtin.systemd:
    name: apparmor
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enforce all AppArmor profiles (best-effort) (Item 7)
  ansible.builtin.shell: |
    set -o pipefail
    for p in /etc/apparmor.d/*; do
      [ -f "$p" ] && aa-complain "$p" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  changed_when: false
