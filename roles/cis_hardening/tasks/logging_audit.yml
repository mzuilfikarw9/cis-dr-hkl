- name: Ensure /etc/systemd/journald.conf.d exists (Item 75)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop-in journald config  (Item 75)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-cis.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      # CIS Compliance Adjustments for Item 75
      SystemMaxUse=1G
      SystemKeepFree=500M
      RuntimeMaxUse=200M
      RuntimeKeepFree=50M
      MaxFileSec=1month

       # CIS Compliance Adjustments for Item 79,80,81
      Storage=persistent
      Compress=yes
      ForwardToSyslog=no
  notify: restart journald


