---

- name: Assert supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version in ["22.04", "24.04"]
    fail_msg: "This role only supports Ubuntu 22.04 or 24.04. Got {{ ansible_distribution }} {{ ansible_distribution_version }}."

- name: Detect cloud-init presence
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: _cloudinit_bin

- name: Set cloudinit_active fact
  ansible.builtin.set_fact:
    cloudinit_active: "{{ _cloudinit_bin.stat.exists and cis_cloudinit_managed }}"

- name: 1.1 Kernel module hardening
  ansible.builtin.import_tasks: kernel_modules.yml
  tags: [section1, kernel_modules]

# - name: 1.1 Mount options
#   ansible.builtin.import_tasks: mount_options.yml
#   tags: [section1, mounts]

- name: 1.2 Package updates and mandatory access control
  ansible.builtin.import_tasks: updates_apparmor.yml
  tags: [section1, apparmor, updates]

- name: 1.4/1.5 Bootloader and process hardening
  ansible.builtin.import_tasks: process_hardening.yml
  tags: [section1, process_hardening]

- name: 1.7 Warning banners
  ansible.builtin.import_tasks: banners.yml
  tags: [section1, banners]

- name: 2 Services
  ansible.builtin.import_tasks: services.yml
  tags: [section2, services]

