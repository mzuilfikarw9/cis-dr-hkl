---
- name: Create dedicated administrative su restriction group (Item 48)
  ansible.builtin.group:
    name: sugroup
    state: present
  become: true

- name: Ensure default admin user is explicitly added to the su group (Item 48)
  ansible.builtin.user:
    name: ubuntu
    groups: sugroup
    append: true
  become: true

- name: Configure PAM to restrict su usage to sugroup members only (Item 48)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    # Looks for an existing pam_wheel.so configuration rule to replace or appends it
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so$'
    line: "auth       required   pam_wheel.so use_uid group=sugroup"
    state: present
  become: true

#--------------------------------------------------

- name: Install password quality library (Item 49, 51)
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Configure pwquality.conf (Item 54)
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      minlen = {{ cis_pwquality.minlen }} #--Item 56
      minclass = {{ cis_pwquality.minclass }} #--Item 57
      dcredit = {{ cis_pwquality.dcredit }} #--Item 57
      ucredit = {{ cis_pwquality.ucredit }} #--Item 57
      ocredit = {{ cis_pwquality.ocredit }} #--Item 57
      lcredit = {{ cis_pwquality.lcredit }} #--Item 57
      difok = {{ cis_pwquality.difok }}     #--Item 55
      maxrepeat = {{ cis_pwquality.maxrepeat }} #--Item 58
      maxsequence = {{ cis_pwquality.maxsequence }} #--Item 59
      dictcheck = 1 #--Item 60
      enforcing = 1 #--Item 61
      # maxclassrepeat = {{ cis_pwquality.maxclassrepeat }}  
      enforce_for_root #--Item 62

- name: Configure faillock.conf (Item 53)
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      deny = {{ cis_faillock.deny }}  #--Item 53
      unlock_time = {{ cis_faillock.unlock_time }} #--Item 54
      fail_interval = {{ cis_faillock.fail_interval }}

