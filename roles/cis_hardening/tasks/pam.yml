---
- name: Create dedicated administrative su restriction group (Item 48)
  ansible.builtin.group:
    name: sugroup
    state: present
  become: true

- name: Ensure default admin user is explicitly added to the su group (Item 48)
  ansible.builtin.user:
    name: ubuntu
    groups: sugroup
    append: true
  become: true

- name: Configure PAM to restrict su usage to sugroup members only (Item 48)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    # Looks for an existing pam_wheel.so configuration rule to replace or appends it
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so$'
    line: "auth       required   pam_wheel.so use_uid group=sugroup"
    state: present
  become: true

#--------------------------------------------------

- name: Install password quality library (Item 49, 51)
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Configure pwquality.conf (Item 55-62)
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      minlen = {{ cis_pwquality.minlen }} 
      minclass = {{ cis_pwquality.minclass }} 
      dcredit = {{ cis_pwquality.dcredit }} 
      ucredit = {{ cis_pwquality.ucredit }} 
      ocredit = {{ cis_pwquality.ocredit }} 
      lcredit = {{ cis_pwquality.lcredit }} 
      difok = {{ cis_pwquality.difok }}     
      maxrepeat = {{ cis_pwquality.maxrepeat }} 
      maxsequence = {{ cis_pwquality.maxsequence }} 
      dictcheck = 1 
      enforcing = 1 
      # maxclassrepeat = {{ cis_pwquality.maxclassrepeat }}  
      enforce_for_root 

- name: Configure faillock.conf (Item 53,54)
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      deny = {{ cis_faillock.deny }}
      unlock_time = {{ cis_faillock.unlock_time }}
      fail_interval = {{ cis_faillock.fail_interval }}

# ======================Hunglv logic for item 50========================================================


- name: Create PAM faillock profile (Item 50)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Enable pam_faillock to deny access
      Default: yes
      Priority: 0
      Auth-Type: Primary
      Auth:
              [default=die] pam_faillock.so authfail

- name: Create PAM faillock_notify profile (Item 50)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock_notify
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Notify of failed login attempts and reset count upon success
      Default: yes
      Priority: 1024
      Auth-Type: Primary
      Auth:
              requisite pam_faillock.so preauth
      Account-Type: Primary
      Account:
              required pam_faillock.so

- name: Create PAM pwhistory profile definition (Item 52,63,64,65)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/pwhistory
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: pwhistory password history checking
      Default: yes
      Priority: 1024
      Password-Type: Primary
      Password:
              requisite pam_pwhistory.so remember=24 enforce_for_root try_first_pass use_authtok


- name: Remove nullok argument from default PAM unix profile safely (Item 66)
  ansible.builtin.replace:
    path: /usr/share/pam-configs/unix
    # Matches nullok and any spaces AFTER it, keeping the space BEFORE it untouched
    regexp: '\bnullok\b[ \t]*'
    replace: ''
  become: true

- name: Explicitly enable pwquality, faillock, and pwhistory PAM profiles
  ansible.builtin.shell: |
    set -o pipefail
    DEBIAN_FRONTEND=noninteractive pam-auth-update --enable unix faillock faillock_notify pwquality pwhistory
  args:
    executable: /bin/bash
  changed_when: false

- name: Set password-aging defaults in /etc/login.defs (Item 68,74)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\b"
    line: "{{ item.key }} {{ item.value }}"
    create: true
  loop:
    - { key: "PASS_MAX_DAYS",  value: "{{ cis_pass_max_days }}" }
    - { key: "PASS_MIN_DAYS",  value: "{{ cis_pass_min_days }}" }
    - { key: "PASS_WARN_AGE",  value: "{{ cis_pass_warn_age }}" }
    - { key: "ENCRYPT_METHOD", value: "YESCRYPT" }
    - { key: "UMASK",          value: "{{ cis_umask }}" }

- name: Enforce 365 day password expiration on the ubuntu user (Item 68)
  ansible.builtin.user:
    name: ubuntu
    password_expire_max: "{{ cis_pass_max_days | int }}"  # Fixed parameter name
  become: true
  
- name: Set password inactivity baseline for FUTURE users (Item 69)
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^INACTIVE='
    line: 'INACTIVE={{ cis_pass_inactivity_period }}'
    create: true
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Enforce inactive lock grace period on the ubuntu user (Item 69)
  ansible.builtin.shell: |
    chage -I {{ cis_pass_inactivity_period | int }} ubuntu
  become: true
  changed_when: false

- name: Ensure root account access is controlled (Item 70)
  ansible.builtin.user:
    name: root
    # password_lock ensures the account status flag is set to locked ('!') in /etc/shadow
    password_lock: true
  become: true