---

cis_cloudinit_managed: true

cis_pass_max_days: 365
cis_pass_min_days: 1
cis_pass_warn_age: 7
cis_pwquality:
  minlen: 14
  minclass: 4
  dcredit: -1
  ucredit: -1
  ocredit: -1
  lcredit: -1
  maxsequence: 3
  difok: 3
  maxrepeat: 3
  maxclassrepeat: 4

cis_faillock:
  deny: 5
  unlock_time: 900
  fail_interval: 900

cis_tmout: 900
cis_umask: "027"

# cis_ssh_allow_groups: "" 
cis_ssh_allow_groups: "sudo ubuntu"         
cis_ssh_client_alive_interval: 300
cis_ssh_client_alive_count_max: 2
cis_ssh_max_auth_tries: 4
cis_ssh_max_sessions: 10
cis_ssh_login_grace_time: 60
cis_ssh_password_auth: false


cis_firewall: ufw                
cis_ssh_port: 22
cis_extra_allow_ports: []         

cis_ntp_servers:
  - 172.16.102.254

cis_audit_backlog_limit: 8192
cis_audit_max_log_file_mb: 32

cis_install_aide: true

cis_packages_remove:
  - autofs
  - avahi-daemon
  - bind9
  - cups
  - dnsmasq
  - dovecot-imapd
  - dovecot-pop3d
  - isc-dhcp-server
  - nfs-kernel-server
  - nis
  - rpcbind
  - rsh-client
  - rsync
  - samba
  - slapd
  - snmpd
  - squid
  - talk
  - telnet
  - tftpd-hpa
  - vsftpd
  - xinetd
  - ypserv
  - prelink
  - ldap-utils
  - ftp

cis_disable_modules:
  - usb-storage
  # - cramfs
  # - freevxfs
  # - hfs
  # - hfsplus
  # - jffs2
  # - overlayfs
  # - squashfs
  # - udf
  # - usb-storage
  # - dccp
  # - tipc
  # - rds
  # - sctp

cis_modules_skip_unload: []

cis_sysctl_base:
  kernel.randomize_va_space: 2
  fs.suid_dumpable: 0
  kernel.yama.ptrace_scope: 1
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.ip_forward: 0
  net.ipv6.conf.all.forwarding: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0

cis_sysctl_overrides: {}

cis_services_enabled:
  - ssh
  - cron
  - auditd
  - rsyslog
  - ufw
