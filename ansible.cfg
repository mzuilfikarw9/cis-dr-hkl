[defaults]
vault_password_file = .vault_pass
inventory = inventories/hkl.ini
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes

timeout = 60

retries = 3

[privilege_escalation]
become = True
become_method = sudo
